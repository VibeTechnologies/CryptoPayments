# Playwright E2E test for CryptoPayments Telegram top-up flow.
# Runs a real Sepolia ERC20 transfer — requires a funded testnet wallet.
#
# Required secrets (repo Settings → Secrets → Actions):
#   CHECKOUT_SECRET         — HMAC secret checked by the /webhook/checkout endpoint
#   TESTNET_WALLET_1_JSON   — base64-encoded contents of testnet/wallet-1.json
#   SUPABASE_SERVICE_ROLE_KEY — Supabase service-role key for the test project

name: E2E – Telegram top-up

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-topup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Write testnet wallet
        run: |
          mkdir -p testnet
          echo "${{ secrets.TESTNET_WALLET_1_JSON }}" | base64 -d > testnet/wallet-1.json

      - name: Start branch CryptoPayments API
        env:
          PORT: "9999"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          CHECKOUT_SECRET: ${{ secrets.CHECKOUT_SECRET }}
          WALLET_ETH: ${{ secrets.WALLET_ETH }}
          WALLET_ETH_SEPOLIA: ${{ secrets.WALLET_ETH }}
        run: |
          nohup pnpm dev > /tmp/cryptopayments-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9999/api/health >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/cryptopayments-api.log
          exit 1

      - name: Run E2E tests
        env:
          CHECKOUT_SECRET: ${{ secrets.CHECKOUT_SECRET }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRANCH_API_URL: http://127.0.0.1:9999
        run: |
          node_modules/.bin/playwright test \
            tests/e2e-telegram-topup.spec.ts \
            tests/e2e-full-wallet-flow.spec.ts \
            --reporter=list

      - name: Branch API diagnostics
        if: always()
        run: tail -n 200 /tmp/cryptopayments-api.log
