# Playwright E2E smoke test for the AppKit mobile wallet QR modal.
#
# Verifies that "Connect Mobile Wallet" button opens the AppKit modal
# with a QR code and featured wallets (Rabby + Coinbase Wallet).
#
# Required secrets (repo Settings → Secrets → Actions):
#   REOWN_PROJECT_ID — Reown (WalletConnect) project ID, free at dashboard.reown.com
#
# The job is skipped gracefully when REOWN_PROJECT_ID is not set.

name: E2E – Mobile Wallet QR Modal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e-mobile-wallet:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
        working-directory: web

      - name: Build static export
        env:
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: pnpm build
        working-directory: web

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Serve static export and run modal smoke test
        env:
          BASE_URL: "http://localhost:3000"
          NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.REOWN_PROJECT_ID }}
        run: |
          npx serve web/out -p 3000 &
          sleep 2
          node_modules/.bin/playwright test tests/e2e-mobile-wallet-modal.spec.ts --reporter=list
