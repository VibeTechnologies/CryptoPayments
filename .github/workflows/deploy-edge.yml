name: Deploy CryptoPayments API

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/functions/crypto-payments/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cryptopayments-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm predeploy:edge
      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: pnpm exec supabase functions deploy crypto-payments --project-ref krjbwbvmrpazdmmjstzo --no-verify-jwt
