name: Transport crypto secrets to AgentPod (one-off, #6138)

# One-off transport for AgentPod #6138 (Hop 1): GitHub Actions secrets are
# write-only, so this repo's wallet/API secrets can only be consumed inside
# this repo's own workflows. This workflow seals each value with the
# VibeTechnologies/AgentPod Actions-secrets public key (libsodium sealed
# box, supplied as dispatch inputs — public material only) and uploads the
# sealed blobs as a short-lived run artifact. The task lead downloads the
# artifact and PUTs each sealed blob into the AgentPod repo secrets; at no
# point does any value exist in plaintext outside this runner's step env.
# Values are never workflow inputs, never echoed, and never printed: the
# sealing step prints only the 8 target names plus "sealed" per name.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "transport" to run the one-off secret transport'
        required: true
        type: string
        default: ""
      agentpod_public_key:
        description: "Base64 libsodium public key of VibeTechnologies/AgentPod Actions secrets"
        required: true
        type: string
      agentpod_key_id:
        description: "Key id of the AgentPod Actions-secrets public key"
        required: true
        type: string

permissions:
  contents: read

jobs:
  transport:
    name: Transport crypto secrets to AgentPod (one-off, #6138)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'transport'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Validate confirmation input
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          if [ "${CONFIRM}" != "transport" ]; then
            echo "::error::Refusing to run: type 'transport' in the confirm input to proceed."
            exit 1
          fi
          echo "Confirmation accepted."

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyNaCl
        run: pip install pynacl

      - name: Seal secrets for AgentPod
        env:
          WALLET_BASE: ${{ secrets.WALLET_BASE }}
          WALLET_ETH: ${{ secrets.WALLET_ETH }}
          WALLET_TON: ${{ secrets.WALLET_TON }}
          WALLET_SOL: ${{ secrets.WALLET_SOL }}
          API_KEY: ${{ secrets.API_KEY }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          AGENTPOD_PUBLIC_KEY: ${{ inputs.agentpod_public_key }}
          AGENTPOD_KEY_ID: ${{ inputs.agentpod_key_id }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          from nacl.public import PublicKey, SealedBox

          # Target name -> source env name. The two Sepolia keys reproduce
          # src/config.ts fallback semantics: they carry the corresponding
          # mainnet wallet value.
          targets = {
              "WALLET_BASE": "WALLET_BASE",
              "WALLET_ETH": "WALLET_ETH",
              "WALLET_TON": "WALLET_TON",
              "WALLET_SOL": "WALLET_SOL",
              "API_KEY": "API_KEY",
              "CALLBACK_SECRET": "CALLBACK_SECRET",
              "WALLET_BASE_SEPOLIA": "WALLET_BASE",
              "WALLET_ETH_SEPOLIA": "WALLET_ETH",
          }

          for env_name in ("AGENTPOD_PUBLIC_KEY", "AGENTPOD_KEY_ID"):
              if not os.environ.get(env_name):
                  print(f"::error::Missing required input: {env_name}", file=sys.stderr)
                  sys.exit(1)

          for source in targets.values():
              if not os.environ.get(source):
                  print(f"::error::Missing required secret: {source}", file=sys.stderr)
                  sys.exit(1)

          public_key = PublicKey(base64.b64decode(os.environ["AGENTPOD_PUBLIC_KEY"]))
          box = SealedBox(public_key)

          sealed = {}
          for target, source in targets.items():
              encrypted = box.encrypt(os.environ[source].encode("utf-8"))
              sealed[target] = base64.b64encode(encrypted).decode("ascii")

          payload = {"key_id": os.environ["AGENTPOD_KEY_ID"], "secrets": sealed}
          with open("sealed-agentpod-secrets.json", "w", encoding="utf-8") as fh:
              json.dump(payload, fh)

          for name in targets:
              print(f"{name}: sealed")
          PY

      - name: Upload sealed secrets artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealed-agentpod-secrets
          path: sealed-agentpod-secrets.json
          retention-days: 1
